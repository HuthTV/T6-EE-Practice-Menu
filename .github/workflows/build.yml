# Builds every map's compiled menu on every push and pull request and uploads each
# as its own artifact: o-prac-menu (Origins), m-prac-menu (Mob of the Dead),
# t-prac-menu (TranZit), d-prac-menu (Die Rise) and b-prac-menu (Buried), each
# holding only the compiled script. The scripts are built with short names (shorten.py):
# which fields and flag strings get renamed comes from the committed shorten_owned.txt,
# so CI ships the same bytes as a local build. names.txt per map maps short names back.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # A gsc-tool release tag (https://github.com/xensik/gsc-tool/releases), or
  # "latest" to follow new releases. 1.5.1 is the version tested in game; newer
  # ones compile the menus but produce different bytecode.
  GSC_TOOL_VERSION: "1.5.1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get gsc-tool
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GSC_TOOL_VERSION
          if ($tag -eq "latest") { $tag = gh release view --repo xensik/gsc-tool --json tagName --jq .tagName }
          Write-Host "gsc-tool $tag"
          gh release download $tag --repo xensik/gsc-tool --pattern windows-x64-release.zip --dir gsc-tool-download
          Expand-Archive gsc-tool-download\windows-x64-release.zip -DestinationPath bin -Force

      - name: Build
        shell: pwsh
        run: |
          if (-not (Test-Path shorten_owned.txt)) { throw "shorten_owned.txt is missing: build once in the workspace and commit it." }
          python build.py -check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: short-names
          path: build/*/names.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: o-prac-menu
          path: build/origins/compiled/t6/o-prac-menu.gsc
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: m-prac-menu
          path: build/mob/compiled/t6/m-prac-menu.gsc
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: t-prac-menu
          path: build/tranzit/compiled/t6/t-prac-menu.gsc
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: d-prac-menu
          path: build/dierise/compiled/t6/d-prac-menu.gsc
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: b-prac-menu
          path: build/buried/compiled/t6/b-prac-menu.gsc
          if-no-files-found: error
